[package]
name = "audioboost"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
description = "A small macOS audio booster with keyboard controls"

[dependencies]
crossterm = { version = "0.29", default-features = false, features = ["events"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
correctness = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
